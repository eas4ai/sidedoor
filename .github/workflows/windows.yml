name: Windows
on:
  push:
    branches: [main, 'codex/cargo-workspace']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
          # Ship the x64 baseline runtime so widgets also work on older CPUs.
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-windows-x64-baseline.zip
      - name: Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: SDK checks
        working-directory: sdk
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run check
          exit $LASTEXITCODE
      - name: Format
        run: cargo fmt --all --check
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Native Windows clipboard test
        run: cargo test -p platform --locked native_clipboard_roundtrips -- --ignored --test-threads=1
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Package
        id: package
        run: ./scripts/package/windows.ps1 -Installers
      - name: Installer smoke test
        run: ./scripts/smoke/windows-installers.ps1
      - name: Packaged application smoke test
        run: ./scripts/smoke/windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-smoke-logs
          path: |
            target/windows-bundle/smoke/*.log
            target/windows-bundle/smoke/*.png
            target/windows-bundle/installer-smoke/*.log
            target/windows-bundle/installer-smoke/*.png
            target/windows-bundle/installer-logs/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && steps.package.outcome == 'success'
        with:
          name: Sidedoor-windows-x64
          path: |
            target/windows-bundle/Sidedoor-windows-x64.zip
            target/windows-bundle/Sidedoor-windows-x64.zip.sha256
            target/windows-bundle/Sidedoor-windows-x64.msi
            target/windows-bundle/Sidedoor-windows-x64.msi.sha256
            target/windows-bundle/Sidedoor-windows-x64-setup.exe
            target/windows-bundle/Sidedoor-windows-x64-setup.exe.sha256
          if-no-files-found: error
