[package]
name = "sidekick"
version = "0.1.0"
edition = "2024"
description = "A minimal Sidekick-style edge dock for macOS, built with GPUI Kit."
publish = false

[dependencies]
gpui-kit = "0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.31", default-features = false, features = ["system", "disk"] }
ureq = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["objc2-core-graphics", "objc2-quartz-core"] }
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
objc2-service-management = "0.3"
raw-window-handle = "0.6"

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
gpui-kit = { version = "0.7.0", features = ["test-support"] }

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
