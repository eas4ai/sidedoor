[workspace]
resolver = "3"
members = [
    "crates/desktop",
    "crates/domain",
    "crates/platform",
    "crates/services",
    "crates/plugin-host",
]
default-members = ["crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
lto = "thin"
strip = true

[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[workspace.dependencies]
domain = { path = "crates/domain" }
platform = { path = "crates/platform" }
services = { path = "crates/services" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.31", default-features = false, features = ["system", "disk"] }
# The OS trust store and proxy settings, so networks behind a proxy work.
ureq = { version = "2", features = ["native-certs", "proxy-from-env"] }
gpui-kit = "0.7.0"
futures = "0.3"
plugin-host = { path = "crates/plugin-host" }
