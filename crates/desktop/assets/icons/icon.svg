<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3F4B"/>
      <stop offset="1" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A8CFF"/>
      <stop offset="1" stop-color="#5A44E6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824 pt body inset 100 pt, continuous-corner squircle. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>

  <!-- The second dock, floating off the right edge. -->
  <g filter="url(#shadow)">
    <rect x="662" y="232" width="150" height="560" rx="62" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4"/>
  </g>
  <rect x="697" y="274" width="80" height="80" rx="20" fill="#0A84FF"/>
  <rect x="697" y="382" width="80" height="80" rx="20" fill="#32D74B"/>
  <rect x="697" y="490" width="80" height="80" rx="20" fill="#FF9F0A"/>
  <rect x="697" y="598" width="80" height="80" rx="20" fill="url(#purple)"/>
  <rect x="716" y="612" width="42" height="52" rx="8" fill="#FFFFFF"/>
  <rect x="725" y="603" width="24" height="15" rx="5" fill="#3B2BB8" stroke="#FFFFFF" stroke-width="4"/>
  <rect x="724" y="630" width="26" height="5" rx="2.5" fill="#7B6BF0"/>
  <rect x="724" y="643" width="18" height="5" rx="2.5" fill="#7B6BF0"/>
  <circle cx="795" cy="314" r="7" fill="#FFFFFF" fill-opacity="0.7"/>
  <circle cx="795" cy="530" r="7" fill="#FFFFFF" fill-opacity="0.7"/>

  <!-- A hover card with its arrow pointing at the dock. -->
  <g filter="url(#shadow)">
    <path d="M 238 520 a 44 44 0 0 1 44 -44 h 290 a 44 44 0 0 1 44 44
             v 22 l 30 30 l -30 30 v 22 a 44 44 0 0 1 -44 44
             h -290 a 44 44 0 0 1 -44 -44 z"
          fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4"/>
  </g>
  <rect x="280" y="522" width="170" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="280" y="568" width="250" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.35"/>
  <rect x="280" y="604" width="120" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.35"/>
</svg>
